# Moonlit Ballroom v1.0 by Mistbloom Studios - Nexo
# Minecraft 1.21.4+.

moonball_waltzing_ghosts:
  itemname: <#c9b8f0>Waltzing Ghosts
  lore:
  - <gray>A friendly ghost couple who never
  - <gray>stop waltzing.
  - <#9fb3d9>Moonlit Ballroom
  material: PAPER
  Components:
    item_model: moonball:waltzing_ghosts
  Mechanics:
    furniture:
      restricted_rotation: VERY_STRICT
      preview_placement: true
      block_sounds:
        place_sound: block.wood.place
        break_sound: block.wood.break
        hit_sound: block.wood.hit
        step_sound: block.wood.step
        fall_sound: block.wood.fall
      limited_placing:
        floor: true
        wall: false
        roof: false
      hitbox:
        interactions:
        - 0,0,0 1.4,1.8
      lights:
        toggleable: false
        lights:
        - 0,0,0 8
      clickActions:
      - conditions: []
        actions:
        - '{source=BLOCKS volume=0.6 pitch=1.2} [sound] minecraft:block.amethyst_block.chime'

