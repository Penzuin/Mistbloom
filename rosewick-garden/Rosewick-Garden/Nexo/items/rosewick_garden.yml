# Rosewick Garden by Mistbloom Studios
# Nexo 1.28+ (light lists, seats, storage).
# Dyeable pieces (bench, chair, picnic blanket): dye them like leather in a crafting table before placing, or change `color`.

rosewick_garden_bench:
  itemname: "<#e6cd8c>Garden Bench"
  material: LEATHER_HORSE_ARMOR
  color: 143,176,106
  lore:
    - "<!i><gray>Two-seat birch bench with a lattice back."
    - "<!i><gray>Dyeable cushions."
    - "<!i><#8fb06a>Rosewick Garden"
  Components:
    item_model: rosewick:garden_bench
  Mechanics:
    furniture:
      block_sounds:
        place_sound: block.wood.place
        break_sound: block.wood.break
        hit_sound: block.wood.hit
        step_sound: block.wood.step
        fall_sound: block.wood.fall
      rotatable: true
      restricted_rotation: VERY_STRICT
      properties:
        display_transform: NONE
      hitbox:
        barriers:
          - 0,0,0
        interactions:
          - 0,0,0 2,1.4
      seats:
        - -0.5,0.5,0
        - 0.5,0.5,0

