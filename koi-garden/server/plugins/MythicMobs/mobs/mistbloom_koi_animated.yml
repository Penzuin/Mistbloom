# Mistbloom - Koi Garden, animated koi (ModelEngine)
# Spawn with: /mm m spawn <name> 1 <world>,<x>,<y>,<z>

mistbloom_koi_pair:
  Type: ARMOR_STAND
  # Swimming Koi Pair
  Health: 1
  Options:
    Marker: true
    Invisible: true
    Invincible: true
    NoGravity: true
    Silent: true
    Persistent: true
    Despawn: false
    PreventOtherDrops: true
  Skills:
  - model{m=mistbloom_koi_pair} @self ~onSpawn
  - model{m=mistbloom_koi_pair} @self ~onLoad

