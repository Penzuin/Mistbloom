# Night Wings - HMCCosmetics
# Uses the resource pack in this folder, no items plugin needed.
# Permission for each one is hmccosmetics.<id>, e.g. hmccosmetics.starfeather_wings

starfeather_wings:
  slot: BACKPACK
  permission: hmccosmetics.starfeather_wings
  dyeable: true
  item:
    material: LEATHER_HORSE_ARMOR
    model-id: mistbloom:starfeather_wings
    color: '#fcf8ff'
    name: <#c9b8ff>Starfeather Wings
    lore:
      - <gray>Soft pearl feathers with gold trim.
      - <dark_gray>Back cosmetic, dyeable

