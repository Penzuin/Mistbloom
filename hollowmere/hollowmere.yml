# Hollowmere - Halloween market set by Mistbloom Studios
# Nexo 1.28+ (furniture states, light lists and click actions).
# Dyeable pieces: dye them like leather in a crafting table before placing, or change `color`.

hollowmere_jack_o_lantern:
  itemname: <#ffb15c>Jack-o'-Lantern
  lore:
  - <gray>A big carved pumpkin.
  - <gray>Right-click to light the candle.
  - <dark_gray>Hollowmere
  material: PAPER
  Components:
    item_model: hollowmere:jack_o_lantern
  Mechanics:
    furniture:
      restricted_rotation: VERY_STRICT
      preview_placement: true
      block_sounds:
        place_sound: block.wood.place
        break_sound: block.wood.break
        hit_sound: block.wood.hit
        step_sound: block.wood.step
        fall_sound: block.wood.fall
      hitbox:
        barriers:
        - 0,0,0
      lights:
        toggleable: true
        toggled_item_model: hollowmere:jack_o_lantern_lit
        lights:
        - 0,1,0 14

